name: Feature request
description: Propose an API, manifest field, stat or behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to build
      description: The mod or class you are writing and what the framework prevents you from doing.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: The workaround you use now, or why none exists.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The API, manifest field or behaviour you would like. A sketch of a call site is enough.
  - type: dropdown
    id: multiplayer
    attributes:
      label: Multiplayer effect
      description: Does the change alter what the join checks see or what a player in a room needs?
      options:
        - No
        - Yes
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Pull request
      options:
        - label: I would like to send a pull request for this.